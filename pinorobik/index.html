<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pino Robik — Becoming Human</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#171512; --paper:#fbf9f4; --red:#cf3a24; }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--paper);
    color:var(--ink);
    font-family:'Grandstander', sans-serif;
    text-align:center;
    padding:2rem;
  }
  .eyebrow{ font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:var(--red); margin-bottom:.6rem; }
  h1{ font-weight:800; font-size:clamp(2.2rem,7vw,3.4rem); margin:0 0 1rem; }
  p{ max-width:34ch; opacity:.75; margin-bottom:2.4rem; }
  a.back{
    font-weight:700; text-decoration:none; color:var(--ink);
    border:2px solid var(--ink); border-radius:100px; padding:.7rem 1.6rem; font-size:.9rem;
  }
</style>
</head>
<body>
  <p class="eyebrow">Capitolo 2 · 2026</p>
  <h1>Pino Robik</h1>
  <p>Questo capitolo è in costruzione. Le fasi della mostra verranno pubblicate qui, con la stessa struttura di Pinocchio 200.</p>
  <a class="back" href="../">← Torna a Becoming Human</a>
</body>
</html>
