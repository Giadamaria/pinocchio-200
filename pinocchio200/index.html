<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinocchio 200</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#171512; --paper:#fbf9f4; --red:#cf3a24; }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--paper);
    color:var(--ink);
    font-family:'Grandstander', sans-serif;
    text-align:center;
    padding:2rem;
  }
  h1{ font-weight:800; font-size:clamp(2rem,7vw,3rem); margin:0 0 2rem; }
  h1 .two-hundred{ color:var(--red); }
  nav{ display:flex; flex-direction:column; gap:.9rem; width:100%; max-width:320px; }
  nav a{
    display:block;
    padding:.9rem 1.4rem;
    border:2px solid var(--ink);
    border-radius:100px;
    text-decoration:none;
    color:var(--ink);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    font-size:.95rem;
  }
  nav a:hover{ background:var(--ink); color:var(--paper); }
  p.note{ margin-top:2.4rem; font-size:.8rem; opacity:.55; max-width:36ch; }
  a.bridge{
    display:inline-block;
    margin-top:2.6rem;
    font-weight:700;
    text-decoration:none;
    color:var(--red);
    font-size:.9rem;
    border-bottom:2px solid var(--red);
    padding-bottom:2px;
  }
</style>
</head>
<body>
  <h1>Pinocchio <span class="two-hundred">200</span></h1>
  <nav>
    <a href="father/">1 · Desire to Become a Father</a>
    <a href="discovery/">2 · Discovery of Ourselves</a>
    <a href="exchange/">3 · Experiences of Exchange</a>
    <a href="family/">4 · Courage for the Family</a>
    <a href="future/">5 · Build Their Own Future</a>
  </nav>
  <p class="note">Cinque fasi, dal desiderio di Geppetto al futuro costruito da Pinocchio.</p>
  <a class="bridge" href="../pinorobik/">Passa a Pino Robik →</a>
</body>
</html>
